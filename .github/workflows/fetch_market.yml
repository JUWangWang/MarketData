name: Fetch Market Data Daily

on:
  schedule:
    # UTC 23:30 = 台灣時間 07:30
    # UTC 週一～週五 = 台灣週二～週六
    # 對應抓取美股週一～週五交易資料
    - cron: '30 23 * * 1-5'

  workflow_dispatch:
    inputs:
      target_date:
        description: '補抓特定日期 (YYYY-MM-DD)，留空則自動抓前一個 NYSE 交易日'
        required: false
        default: ''

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            yfinance>=0.2.40 \
            requests>=2.31.0 \
            pandas>=2.0.0 \
            beautifulsoup4>=4.12.0 \
            pandas_market_calendars>=4.4.0

      - name: Fetch market data with retry
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: |
          for attempt in 1 2 3
          do
            echo "======================================"
            echo "Market data attempt: $attempt / 3"
            echo "======================================"

            if [ -n "${{ github.event.inputs.target_date }}" ]; then
              python fetch_market.py "${{ github.event.inputs.target_date }}" && exit 0
            else
              python fetch_market.py && exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Data not ready. Retry after 20 minutes..."
              sleep 1200
            fi
          done

          echo "Market data still not ready after 3 attempts."
          exit 1

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --staged --quiet || \
            git commit -m "📊 Daily market data $(date -u +%Y-%m-%d)"

          git push
